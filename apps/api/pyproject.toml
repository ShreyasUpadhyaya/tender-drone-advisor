[project]
name = "tender-drone-advisor-api"
version = "0.1.0"
description = "Tender Drone Advisor API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "boto3>=1.35,<2.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.0,<6.0",
  "pytesseract>=0.3,<1.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "pymupdf>=1.25,<2.0",
  "redis>=5.2,<6.0",
  "rq>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "reportlab>=4.2,<5.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
