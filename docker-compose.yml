name: tender-drone-advisor

x-extraction-environment: &extraction-environment
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-fixture-v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  EXTRACTION_MAX_REPAIRS: ${EXTRACTION_MAX_REPAIRS:-1}
  EXTRACTION_TRANSIENT_RETRIES: ${EXTRACTION_TRANSIENT_RETRIES:-1}
  EXTRACTION_CONFIDENCE_THRESHOLD: ${EXTRACTION_CONFIDENCE_THRESHOLD:-0.8}
  EXTRACTION_BATCH_CHARS: ${EXTRACTION_BATCH_CHARS:-12000}
  EXTRACTION_MAX_BATCHES: ${EXTRACTION_MAX_BATCHES:-32}
  RAG_NAMESPACE: ${RAG_NAMESPACE:-local-demo}
  RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-fake}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-hash-v1}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-256}
  RAG_REPORT_PROVIDER: ${RAG_REPORT_PROVIDER:-fake}
  RAG_REPORT_MODEL: ${RAG_REPORT_MODEL:-fixture-report-v1}
  RAG_EXTERNAL_ENABLED: ${RAG_EXTERNAL_ENABLED:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tender_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-tender_advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-replace-with-local-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-replace-with-local-secret-key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./apps/api
    environment:
      <<: *extraction-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tender_advisor:replace-with-local-password@postgres:5432/tender_advisor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-tender-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-replace-with-local-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-local-secret-key}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *extraction-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tender_advisor:replace-with-local-password@postgres:5432/tender_advisor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-tender-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-replace-with-local-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-local-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  minio-data:
  postgres-data:
